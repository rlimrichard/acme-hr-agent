<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Acme HR Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__mark">Acme</span>
        <span class="topbar__product">HR Agent</span>
      </div>
      <nav class="topbar__nav" aria-label="Main navigation">
        <a class="nav-link" href="/">Chat</a>
        <a class="nav-link" href="/hr-docs">HR Documents</a>
        <a class="nav-link nav-link--active" href="/admin" aria-current="page">Admin</a>
      </nav>
      <div class="topbar__spacer"></div>
      <a class="nav-link" href="/admin/logout" style="margin-right: 4px;">Log out</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle light/dark mode"
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <div class="admin-panel">
      <!-- Tab switcher -->
      <div class="admin-tabs" role="tablist">
        <button class="admin-tab admin-tab--active" id="tab-conversations" role="tab" aria-selected="true" aria-controls="panel-conversations">Conversations</button>
        <button class="admin-tab" id="tab-prompts" role="tab" aria-selected="false" aria-controls="panel-prompts">Prompt audit</button>
        <button class="admin-tab" id="tab-tickets" role="tab" aria-selected="false" aria-controls="panel-tickets">Tickets</button>
        <button class="admin-tab" id="tab-database" role="tab" aria-selected="false" aria-controls="panel-database">Database</button>
      </div>

      <!-- Prompt audit panel -->
      <div id="panel-prompts" role="tabpanel" aria-labelledby="tab-prompts" style="display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden;">
        <div class="admin-toolbar">
          <label for="prompt-date-select">Date</label>
          <select id="prompt-date-select" class="admin-date-select"><option value="">Loading…</option></select>
          <span class="admin-count" id="prompt-count"></span>
        </div>
        <div class="admin-entries" id="prompt-list"><div class="admin-empty">Loading prompt audit…</div></div>
      </div>

      <!-- Conversations panel -->
      <div id="panel-conversations" role="tabpanel" aria-labelledby="tab-conversations" style="display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;">
        <div class="admin-toolbar">
          <label for="date-select">Date</label>
          <select id="date-select" class="admin-date-select">
            <option value="">Loading…</option>
          </select>
          <span class="admin-count" id="entry-count"></span>
        </div>
        <div class="admin-entries" id="entries-list">
          <div class="admin-empty">Loading logs…</div>
        </div>
      </div>

      <!-- Tickets panel -->
      <div id="panel-tickets" role="tabpanel" aria-labelledby="tab-tickets" style="display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden;">
        <div class="admin-toolbar">
          <span class="admin-count" id="ticket-count"></span>
        </div>
        <div class="admin-entries" id="tickets-list">
          <div class="admin-empty">Loading tickets…</div>
        </div>
      </div>

      <!-- Read-only Chroma SQLite browser -->
      <div id="panel-database" role="tabpanel" aria-labelledby="tab-database" style="display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden;">
        <div class="admin-toolbar">
          <label for="database-table-select">Table</label>
          <select id="database-table-select" class="admin-date-select"><option value="">Loading…</option></select>
          <span class="admin-count" id="database-count"></span>
        </div>
        <div class="admin-entries" id="database-list"><div class="admin-empty">Loading database…</div></div>
      </div>
    </div>
  </div>

  <script src="/static/admin.js"></script>
</body>
</html>
