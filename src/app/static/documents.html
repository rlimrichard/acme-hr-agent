<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Documents — Acme HR Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__mark">Acme</span>
        <span class="topbar__product">HR Agent</span>
      </div>
      <nav class="topbar__nav" aria-label="Main navigation">
        <a class="nav-link" href="/">Chat</a>
        <a class="nav-link nav-link--active" href="/hr-docs" aria-current="page">HR Documents</a>
      </nav>
      <div class="topbar__spacer"></div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle light/dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <section class="docs-panel" id="panel-docs">
      <div class="docs-toolbar">
        <input class="docs-search" id="docs-search" type="search" placeholder="Filter by title, ID, or format…" autocomplete="off" />
        <div class="docs-count" id="docs-count"></div>
      </div>
      <div class="docs-list" id="docs-list">
        <div class="docs-loading">Loading documents…</div>
      </div>
    </section>
  </div>

  <div class="doc-modal" id="doc-modal" hidden>
    <div class="doc-modal__backdrop" id="modal-backdrop"></div>
    <div class="doc-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="doc-modal__header">
        <span class="doc-modal__title" id="modal-title"></span>
        <a class="doc-modal__download" id="modal-download" download aria-label="Download">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3v13M7 12l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          Download
        </a>
        <button class="doc-modal__close" id="modal-close" aria-label="Close preview">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="doc-modal__body" id="modal-body"></div>
    </div>
  </div>

  <script src="/static/docs.js"></script>
</body>
</html>
