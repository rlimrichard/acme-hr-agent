<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acme HR Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__mark">Acme</span>
        <span class="topbar__product">HR Agent</span>
      </div>
      <nav class="topbar__nav" aria-label="Main navigation">
        <a class="nav-link nav-link--active" href="/" aria-current="page">Chat</a>
        <a class="nav-link" href="/hr-docs">HR Documents</a>
        <a class="nav-link" href="/admin">Admin</a>
      </nav>
      <div class="topbar__session">
        <label for="employee-id">Employee ID</label>
        <select id="employee-id" aria-label="Select employee" disabled>
          <option value="">Loading employees…</option>
        </select>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle light/dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="topbar__status" id="health-status" title="Backend status">
        <span class="status-dot" id="health-dot"></span>
        <span id="health-label">checking…</span>
      </div>
    </header>

    <main class="thread" id="thread" aria-live="polite">
      <div class="thread__intro" id="intro">
        <div class="intro__avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="8" r="3.1" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3.25 19c0-3.176 2.574-5.75 5.75-5.75s5.75 2.574 5.75 5.75" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="16.7" cy="7.6" r="2.4" stroke="currentColor" stroke-width="1.4" opacity="0.7"/>
            <path d="M14.9 13.1c2.16.36 3.8 2.2 3.8 4.42" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
          </svg>
        </div>
        <h1>Hi, I'm here to help with HR questions.</h1>
        <p>Ask about time off, remote work, or expenses — every answer points back to the policy it came from.</p>

        <div class="openers">
          <p class="openers__label">A few things people ask</p>
          <div class="openers__row">
            <button class="opener" data-query="Can I take 3 days off next week?">
              <span class="opener__title">Request time off</span>
              <span class="opener__sub">Check your PTO balance</span>
            </button>
            <button class="opener" data-query="Can I work from Spain for 6 weeks?">
              <span class="opener__title">Remote work eligibility</span>
              <span class="opener__sub">Working from another country</span>
            </button>
            <button class="opener" data-query="Can I expense a $300 home office chair?">
              <span class="opener__title">Check an expense</span>
              <span class="opener__sub">See if a purchase is covered</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <form class="composer" id="composer">
      <textarea id="query-input" rows="1" placeholder="Ask a question…" autocomplete="off"></textarea>
      <button type="submit" id="send-btn" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.5 10L17.5 2.5L12.5 17.5L10 11.5L2.5 10Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M10 11.5L17.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </div>

  <template id="tpl-user-message">
    <div class="message message--user">
      <div class="message__bubble"></div>
    </div>
  </template>

  <template id="tpl-agent-message">
    <div class="message message--agent">
      <div class="message__avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="8" r="3.1" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3.25 19c0-3.176 2.574-5.75 5.75-5.75s5.75 2.574 5.75 5.75" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="16.7" cy="7.6" r="2.4" stroke="currentColor" stroke-width="1.4" opacity="0.7"/>
          <path d="M14.9 13.1c2.16.36 3.8 2.2 3.8 4.42" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
        </svg>
      </div>
      <div class="message__bubble">
        <p class="message__answer"></p>
        <div class="message__escalated" hidden></div>

        <button type="button" class="confirm-btn" hidden>Yes, go ahead — confirm</button>

        <div class="message__section message__citations" hidden>
          <button type="button" class="section-toggle">Sources <span class="count"></span></button>
          <div class="section-body citations-body"></div>
        </div>

        <div class="message__section message__trace" hidden>
          <button type="button" class="section-toggle">How I got this answer <span class="count"></span></button>
          <div class="section-body trace-body"></div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-thinking">
    <div class="message message--agent message--thinking">
      <div class="message__avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="8" r="3.1" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3.25 19c0-3.176 2.574-5.75 5.75-5.75s5.75 2.574 5.75 5.75" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="16.7" cy="7.6" r="2.4" stroke="currentColor" stroke-width="1.4" opacity="0.7"/>
          <path d="M14.9 13.1c2.16.36 3.8 2.2 3.8 4.42" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
        </svg>
      </div>
      <div class="message__bubble">
        <span class="thinking-dots"><span></span><span></span><span></span></span>
      </div>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
