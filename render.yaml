services:
  - type: web
    name: acme-hr-agent
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m src.rag.ingest
    startCommand: uvicorn src.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false          # set manually in Render dashboard — never committed
      - key: OPENROUTER_MODEL
        value: qwen/qwen3.8-27b:free
      - key: MCP_SERVER_URL
        value: http://127.0.0.1:8001
    healthCheckPath: /health
